<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />

    <!-- ============================================ -->
    <!-- INJECT FIREBASE ENV FROM VERCEL              -->
    <!-- ============================================ -->
    <script>
        // Ini adalah file yang akan diproses oleh Vercel
        // Vercel akan mengganti ${process.env.XXX} dengan nilai yang sebenarnya
        (function() {
            console.log('🔧 Injecting Firebase configuration from Vercel...');
            
            // Inisialisasi window.__env
            window.__env = window.__env || {};
            
            // Ambil dari process.env (Vercel akan mengganti ini saat build)
            // Penting: Gunakan format yang tepat agar Vercel bisa mengganti
            const env = {
                FIREBASE_API_KEY: '${process.env.FIREBASE_API_KEY || ""}',
                FIREBASE_AUTH_DOMAIN: '${process.env.FIREBASE_AUTH_DOMAIN || ""}',
                FIREBASE_PROJECT_ID: '${process.env.FIREBASE_PROJECT_ID || ""}',
                FIREBASE_STORAGE_BUCKET: '${process.env.FIREBASE_STORAGE_BUCKET || ""}',
                FIREBASE_MESSAGING_SENDER_ID: '${process.env.FIREBASE_MESSAGING_SENDER_ID || ""}',
                FIREBASE_APP_ID: '${process.env.FIREBASE_APP_ID || ""}',
                FIREBASE_MEASUREMENT_ID: '${process.env.FIREBASE_MEASUREMENT_ID || ""}'
            };
            
            let validCount = 0;
            let invalidCount = 0;
            
            // Hanya set nilai yang valid (bukan placeholder)
            Object.keys(env).forEach(key => {
                const value = env[key];
                // Cek apakah value valid (bukan placeholder dan bukan empty)
                if (value && value !== '' && 
                    !value.includes('YOUR_') && 
                    !value.includes('${') &&
                    !value.includes('process.env')) {
                    window.__env[key] = value;
                    validCount++;
                } else {
                    invalidCount++;
                    // Simpan empty string untuk yang tidak ditemukan
                    window.__env[key] = '';
                }
            });
            
            console.log(`📊 Environment variables loaded: ${validCount} valid, ${invalidCount} missing`);
            
            if (validCount === 0) {
                console.error('❌ No Firebase environment variables found!');
                console.error('Please set these variables in Vercel:');
                console.error('  - FIREBASE_API_KEY');
                console.error('  - FIREBASE_AUTH_DOMAIN');
                console.error('  - FIREBASE_PROJECT_ID');
                console.error('  - FIREBASE_STORAGE_BUCKET');
                console.error('  - FIREBASE_MESSAGING_SENDER_ID');
                console.error('  - FIREBASE_APP_ID');
                
                // Tampilkan pesan error di UI
                document.addEventListener('DOMContentLoaded', function() {
                    const errorDiv = document.createElement('div');
                    errorDiv.style.cssText = `
                        position: fixed;
                        top: 20px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: #FF4757;
                        color: white;
                        padding: 16px 24px;
                        border-radius: 12px;
                        z-index: 99999;
                        font-weight: 600;
                        box-shadow: 0 8px 24px rgba(255, 71, 87, 0.4);
                        text-align: center;
                        max-width: 90%;
                        font-family: 'Inter', sans-serif;
                        animation: slideDown 0.5s ease;
                    `;
                    errorDiv.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 12px; justify-content: center;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 20px;"></i>
                            <div>
                                <div style="font-weight: 700; margin-bottom: 4px;">Firebase Configuration Error</div>
                                <div style="font-weight: 400; font-size: 13px; opacity: 0.9;">
                                    Please set environment variables in Vercel
                                </div>
                            </div>
                        </div>
                    `;
                    document.body.prepend(errorDiv);
                });
            } else {
                console.log(`✅ ${validCount} Firebase environment variables loaded successfully`);
            }
        })();
    </script>
